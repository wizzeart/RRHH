<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Firma Digital IML</title>
    <!-- Tailwind CSS desde CDN para diseño rápido -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Signature Pad -->
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <style>
        .signature-wrapper {
            position: relative;
            width: 500px;
            height: 200px;
            border: 2px dashed #cbd5e1;
            background-color: #f8fafc;
            border-radius: 0.5rem;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-2xl">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">Firma Digital IML</h1>
        
        <form id="signForm" class="space-y-6">
            
            <!-- 1. Cargar Documento -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">1. Seleccionar Documento Word (.docx)</label>
                <input type="file" id="docFile" accept=".docx" class="block w-full text-sm text-gray-500
                  file:mr-4 file:py-2 file:px-4
                  file:rounded-full file:border-0
                  file:text-sm file:font-semibold
                  file:bg-blue-50 file:text-blue-700
                  hover:file:bg-blue-100
                " required />
            </div>

            <!-- 2. Nombre del Firmante -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">2. Nombre del Firmante</label>
                <input type="text" id="signerName" placeholder="Ej: Juan Pérez" class="w-full px-4 py-2 border rounded-md focus:ring-blue-500 focus:border-blue-500" required />
            </div>

            <!-- 3. Panel de Firma -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">3. Firma Manuscrita</label>
                <div class="signature-wrapper mx-auto">
                    <canvas id="signature-pad"></canvas>
                </div>
                <button type="button" id="clearBtn" class="mt-2 text-sm text-red-500 hover:text-red-700 font-medium">Limpiar Firma</button>
            </div>

            <!-- Botones -->
            <div class="pt-4">
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md flex justify-center items-center">
                    <span>Generar Documento Firmado</span>
                    <svg id="spinner" class="animate-spin ml-2 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </div>
        </form>

        <div id="resultArea" class="mt-6 hidden p-4 bg-green-50 rounded-md border border-green-200">
            <p class="text-green-800 font-semibold mb-2">¡Documento firmado exitosamente!</p>
            <a id="downloadLink" href="#" class="inline-flex items-center px-4 py-2 bg-green-600 hover:bg-green-700 text-white text-sm font-medium rounded-md">
                Descargar Documento
            </a>
        </div>
        
        <div id="errorArea" class="mt-6 hidden p-4 bg-red-50 rounded-md border border-red-200">
            <p id="errorMsg" class="text-red-800 font-semibold"></p>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('signature-pad');
        const signaturePad = new SignaturePad(canvas, {
            backgroundColor: 'rgba(255, 255, 255, 0)',
            penColor: 'rgb(0, 0, 139)' // Azul oscuro profesional
        });

        // Redimensionar canvas correctamente
        function resizeCanvas() {
            const ratio =  Math.max(window.devicePixelRatio || 1, 1);
            canvas.width = canvas.offsetWidth * ratio;
            canvas.height = canvas.offsetHeight * ratio;
            canvas.getContext("2d").scale(ratio, ratio);
            signaturePad.clear(); // Limpiar al redimensionar para evitar distorsión
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        document.getElementById('clearBtn').addEventListener('click', () => signaturePad.clear());

        const form = document.getElementById('signForm');
        const submitBtn = document.getElementById('submitBtn');
        const spinner = document.getElementById('spinner');
        const resultArea = document.getElementById('resultArea');
        const downloadLink = document.getElementById('downloadLink');
        const errorArea = document.getElementById('errorArea');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (signaturePad.isEmpty()) {
                alert("Por favor, dibuje su firma.");
                return;
            }

            const fileInput = document.getElementById('docFile');
            if (fileInput.files.length === 0) {
                alert("Seleccione un documento.");
                return;
            }

            // UI Loading
            submitBtn.disabled = true;
            spinner.classList.remove('hidden');
            resultArea.classList.add('hidden');
            errorArea.classList.add('hidden');

            try {
                // 1. Subir Documento
                const formDataDoc = new FormData();
                formDataDoc.append('file', fileInput.files[0]);

                console.log("Subiendo documento...");
                const uploadRes = await fetch('/upload', {
                    method: 'POST',
                    body: formDataDoc
                });
                
                if (!uploadRes.ok) throw new Error("Error subiendo el documento");
                const uploadData = await uploadRes.json();
                const docPath = uploadData.path;

                // 2. Preparar Imagen de Firma
                // Convertir DataURL a Blob
                const dataURL = signaturePad.toDataURL('image/png');
                const res = await fetch(dataURL);
                const blob = await res.blob();

                // 3. Enviar todo para firmar
                const formDataSign = new FormData();
                formDataSign.append('signer_name', document.getElementById('signerName').value);
                formDataSign.append('document_path', docPath);
                formDataSign.append('signature_image', blob, "firma.png");

                console.log("Solicitando firma...");
                const signRes = await fetch('/sign', {
                    method: 'POST',
                    body: formDataSign
                });

                if (!signRes.ok) {
                    const err = await signRes.json();
                    throw new Error(err.detail || err.error || "Error en el servidor");
                }

                // 4. Descargar
                const signedBlob = await signRes.blob();
                const url = window.URL.createObjectURL(signedBlob);
                
                downloadLink.href = url;
                downloadLink.download = `firmado_${fileInput.files[0].name}`;
                resultArea.classList.remove('hidden');

            } catch (error) {
                console.error(error);
                errorMsg.textContent = error.message;
                errorArea.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                spinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
