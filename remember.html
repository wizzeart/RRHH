        <script>
            $(document).ready(function () {


                $('#btn-reset').click(function () {
                    //alvaro.ma@alvsoftware.es
                    var status = 1;
                    var msg='';
                    
                    if($('#email').val()==''){
                        status=0;
                        msg+='El campo Email es obligatorio.';
                    }

                    if (status == 1) {
                        var cmd = 'module=reset&' + $.param($('#email').serializeArray());
                        $.ajax({url: 'api-app.php', type: 'GET', data: cmd, dataType: 'json',
                            success: function (d) {
                                if (d.status == 1) {
                                    alert(d.msg);
                                    //location.href = 'login.html';
                                } else {
                                    alert(d.msg);
                                }
                            }
                        });
                    } else {
                        alert(msg);
                    }
                });
            });
        </script>
