        <script>
                  $(document).ready(function () {
                      $("input[type=text],input[type=password]").keypress(function (d) {
                          if (d.keyCode == 13)
                              $("#btn-login").click();
                      });
                      $("#btn-login").click(function () {
                          var status = 1;
                          var msg = "";

                          if ($("#email").val() == "") {
                              status = 0;
                              msg += "El campo Email es obligatorio.<br>";
                          }
                          if ($("#pwd").val() == "") {
                              status = 0;
                              msg += "El campo Contraseña es obligatorio.<br>";
                          }

                          if (status == 1) {
                              var cmd =
                                      "module=login&" + $.param($("#email,#pwd").serializeArray());
                              $.ajax({
                                  url: "api-app.php",
                                  type: "GET",
                                  data: cmd,
                                  dataType: "json",
                                  success: function (d) {
                                      if (d.status == 1) {
                                          // Redirect based on user role
                                          if (d.rol == '3') {
                                              location.href = "index.php?module=list-recursos";
                                          } else if (d.rol == '4') {
                                              location.href = "index.php?module=home";
                                          } else {
                                              location.href = "index.php?module=home";
                                          }
                                      } else {
                                          alert(d.msg);
                                      }
                                  },
                              });
                          } else {
                              // Adicionar el mensaje de error en el diálogo
                              document.getElementById("contenidoDialogo").innerHTML = msg;
                              // Mostrar el diálogo
                              document.getElementById("miDialogo").showModal();
                              // alert(msg);
                          }
                      });
                      $("#email").focus();
                  });
        </script>
